<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi High Court Case Scraper</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { padding-top: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group label { font-weight: bold; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
        .flash-messages { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">Delhi High Court Case Details</h2>

        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST" action="/">
            <div class="form-group">
                <label for="case_type">Case Type:</label>
                <select class="form-control" id="case_type" name="case_type" required>
                    {% for type in case_types %}
                        <option value="{{ type }}">{{ type }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="case_number">Case Number:</label>
                <input type="text" class="form-control" id="case_number" name="case_number" required>
            </div>

            <div class="form-group">
                <label for="case_year">Filing Year:</label>
                <select class="form-control" id="case_year" name="case_year" required>
                    {% for year in years %}
                        <option value="{{ year }}" {% if loop.index0 == 0 %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Fetch Case Details</button>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
